# MLflow experiment for ADAPT runs and traces. On a fresh workspace, the
# agent-first release may create this path while logging the model; the later
# bundle deploy adopts it as a resource and applies group permissions.

resources:
  experiments:
    adapt_experiment:
      name: ${var.experiment_path}
      lifecycle:
        # Destroying the experiment permanently removes runs and traces.
        prevent_destroy: true
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.app_admin_group}
        - level: CAN_READ
          group_name: ${var.app_user_group}
