# App-owned schema for optional OpenTelemetry tables. The schema itself has no
# ingestion cost; app_telemetry_destinations controls whether telemetry is sent.

resources:
  schemas:
    adapt_telemetry_schema:
      catalog_name: ${var.app_catalog}
      name: ${var.app_telemetry_schema}
      comment: "ADAPT: optional OpenTelemetry logs, metrics, and traces."
      lifecycle:
        # Destroying this schema permanently removes telemetry history.
        prevent_destroy: true
