# MLflow experiment for ADAPT runs and traces.
# Declaring it creates the experiment and permissions before the first model log.

resources:
  experiments:
    adapt_experiment:
      name: ${var.experiment_path}
      lifecycle:
        # Destroying the experiment permanently removes runs and traces.
        prevent_destroy: true
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.app_admin_group}
        - level: CAN_READ
          group_name: ${var.app_user_group}
